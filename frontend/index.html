    <script>
      // Signal Telegram that the Mini App is ready before loading the application bundle.
      // Telegram's native loading layer must not depend on Svelte finishing its startup.
      (function () {
        var root = document.getElementById('app');
        if (root) {
          root.innerHTML = '<main id="boot-fallback" role="status" aria-live="polite"><span class="boot-mark">H</span><strong>HASSLE NFT</strong><span>Запускаем маркетплейс…</span><small>Подготавливаем каталог и профиль</small><i class="boot-spinner" aria-hidden="true"></i></main>';
        }
        try {
          var webApp = window.Telegram && window.Telegram.WebApp;
          if (webApp && typeof webApp.ready === 'function') webApp.ready();
          if (webApp && typeof webApp.expand === 'function') webApp.expand();
        } catch (error) {
          console.error('HASSLE NFT Telegram bootstrap failed', error);
        }
        window.__HASSLE_NFT_SHOW_BOOT_ERROR__ = function (message) {
          var target = document.getElementById('app');
          if (!target || target.dataset.bootState === 'ready') return;
          target.innerHTML = '<main id="boot-fallback" role="alert"><span class="boot-mark">H</span><strong>Не удалось открыть HASSLE NFT</strong><span>Интерфейс не запустился.</span><small></small><button type="button" style="margin:12px auto 0;padding:12px 18px;border:1px solid #9b7bff66;border-radius:10px;background:#9b7bff22;color:#fff" onclick="location.reload()">Повторить запуск</button></main>';
          var detail = target.querySelector('small');
          if (detail) detail.textContent = String(message || 'Unknown startup error').slice(0, 180);
          target.dataset.bootState = 'error';
        };
        window.addEventListener('error', function (event) {
          if (document.getElementById('app')?.dataset.bootState !== 'ready') {
            window.__HASSLE_NFT_SHOW_BOOT_ERROR__(event.message || 'JavaScript error');
          }
        });
        window.addEventListener('unhandledrejection', function (event) {
          if (document.getElementById('app')?.dataset.bootState !== 'ready') {
            var reason = event.reason;
            window.__HASSLE_NFT_SHOW_BOOT_ERROR__(reason && reason.message ? reason.message : reason);
          }
        });
        window.setTimeout(function () {
          var target = document.getElementById('app');
          if (target && target.dataset.bootState !== 'ready') {
            window.__HASSLE_NFT_SHOW_BOOT_ERROR__('Приложение не завершило запуск за 15 секунд. Проверьте соединение и повторите попытку.');
          }
        }, 15000);
      })();
