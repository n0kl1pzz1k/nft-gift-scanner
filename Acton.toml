[package]
name = "gift-radar-ton-escrow"
description = "GIFT RADAR per-deal NFT custody escrow for TON testnet"
version = "0.1.0"
license = "UNLICENSED"

[contracts.GiftRadarEscrow]
src = "contracts/GiftRadarEscrow.tolk"
depends = []
output = "artifacts/GiftRadarEscrow.boc"

[contracts.GiftRadarPaymentEscrow]
src = "contracts/GiftRadarPaymentEscrow.tolk"
depends = []
output = "artifacts/GiftRadarPaymentEscrow.boc"

[contracts.MockNftItem]
src = "contracts/test-support/MockNftItem.tolk"
depends = []
output = "artifacts/MockNftItem.boc"

[wrappers.tolk]
output-dir = "wrappers"

[import-mappings]
acton = ".acton"
contracts = "contracts"
tests = "tests"
wrappers = "wrappers"
gen = "gen"
