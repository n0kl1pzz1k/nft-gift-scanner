name: Deploy TON testnet escrow demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY-TESTNET to deploy the isolated testnet demo
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gift-radar-ton-testnet-demo-deployment
  cancel-in-progress: false

jobs:
  deploy-testnet-demo:
    if: ${{ inputs.confirm == 'DEPLOY-TESTNET' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require dedicated testnet-only mnemonic
        env:
          TON_TESTNET_DEMO_MNEMONIC: ${{ secrets.TON_TESTNET_DEMO_MNEMONIC }}
        run: |
          set -euo pipefail
          if [ -z "${TON_TESTNET_DEMO_MNEMONIC:-}" ]; then
            echo "::error::Add TON_TESTNET_DEMO_MNEMONIC as a GitHub Actions secret. Never use a mainnet or personal wallet mnemonic."
            exit 1
          fi
      - name: Install pinned Acton 1.2.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acton" "$HOME/.local/bin"
          curl -fsSL "https://github.com/ton-blockchain/acton/releases/download/v1.2.1/acton-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/acton.tar.gz"
          echo "490d6763dcfe148e9c8346e3d56c398e950552d329a768b7e9168d4dd54afe3f  $RUNNER_TEMP/acton.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/acton.tar.gz" -C "$RUNNER_TEMP/acton"
          ACTON_BIN="$(find "$RUNNER_TEMP/acton" -type f -name acton -perm -u+x -print -quit)"
          test -n "$ACTON_BIN"
          install -m 0755 "$ACTON_BIN" "$HOME/.local/bin/acton"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          acton --version
      - name: Initialize Acton and prepare wallet references
        env:
          TON_TESTNET_DEMO_MNEMONIC: ${{ secrets.TON_TESTNET_DEMO_MNEMONIC }}
        run: |
          set -euo pipefail
          acton init --stdlib-only
          cp wallets.example.toml wallets.toml
          acton wallet list
      - name: Build contracts and generate wrappers
        run: |
          set -euo pipefail
          acton build GiftRadarPaymentEscrow
          acton build MockNftCollection
          acton build MockNftItem
          acton build JettonWallet
          acton build JettonMinter
          acton wrapper GiftRadarPaymentEscrow
          acton wrapper MockNftCollection
          acton wrapper MockNftItem
          acton wrapper JettonWallet
          acton wrapper JettonMinter
      - name: Request free testnet faucet funds
        env:
          TON_TESTNET_DEMO_MNEMONIC: ${{ secrets.TON_TESTNET_DEMO_MNEMONIC }}
          TONCENTER_TESTNET_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          acton wallet airdrop deployer --net testnet --no-wait-airdrop || echo "::warning::Faucet request did not complete; ensure the deployer wallet has testnet GRAM before deployment."
          acton wallet list --balance
      - name: Deploy contracts and run testnet E2E
        env:
          TON_TESTNET_DEMO_MNEMONIC: ${{ secrets.TON_TESTNET_DEMO_MNEMONIC }}
          TONCENTER_TESTNET_API_KEY: ${{ secrets.TONCENTER_TESTNET_API_KEY }}
        run: |
          set -euo pipefail
          acton script scripts/deploy_testnet_e2e.tolk --net testnet --verbose --show-bodies 2>&1 | tee testnet-deployment.txt
      - name: Upload public deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gift-radar-ton-testnet-deployment
          path: testnet-deployment.txt
          if-no-files-found: ignore
          retention-days: 14
