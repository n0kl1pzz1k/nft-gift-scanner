name: HASSLE NFT Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit
      - name: Check Python dependency advisories
        run: pip-audit -r requirements.txt

  frontend-dependencies:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve frontend dependency tree
        working-directory: frontend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check high and critical npm advisories
        working-directory: frontend
        run: npm audit --audit-level=high
