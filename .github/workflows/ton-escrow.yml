name: TON testnet escrow and payment v2

on:
  push:
    branches:
      - main
      - feat/testnet-ton-usdt-escrow-e2e
  pull_request:
    branches:
      - main
      - payments/stars-ton-proof-phase-2026-11-13
      - feat/ton-testnet-escrow
      - feat/escrow-configurable-authorities

permissions:
  contents: read

concurrency:
  group: ton-escrow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escrow-contract:
    name: Build and test Tolk escrow (local emulator only)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Acton 1.2.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acton" "$HOME/.local/bin"
          curl -fsSL "https://github.com/ton-blockchain/acton/releases/download/v1.2.1/acton-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/acton.tar.gz"
          echo "490d6763dcfe148e9c8346e3d56c398e950552d329a768b7e9168d4dd54afe3f  $RUNNER_TEMP/acton.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/acton.tar.gz" -C "$RUNNER_TEMP/acton"
          ACTON_BIN="$(find "$RUNNER_TEMP/acton" -type f -name acton -perm -u+x -print -quit)"
          test -n "$ACTON_BIN"
          install -m 0755 "$ACTON_BIN" "$HOME/.local/bin/acton"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          acton --version
      - name: Initialize pinned Acton standard library
        run: acton init --stdlib-only
      - name: Build escrow contract
        run: acton build GiftRadarEscrow
      - name: Build payment escrow contract
        run: acton build GiftRadarPaymentEscrow
      - name: Build TEP-62 test NFT collection and item
        run: |
          acton build MockNftCollection
          acton build MockNftItem
      - name: Build TEP-74 reference Jetton wallet
        run: acton build JettonWallet
      - name: Build TEP-74 reference Jetton minter
        run: acton build JettonMinter
      - name: Generate typed test wrappers
        run: |
          acton wrapper GiftRadarEscrow
          acton wrapper GiftRadarPaymentEscrow
          acton wrapper MockNftCollection
          acton wrapper MockNftItem
          acton wrapper JettonWallet
          acton wrapper JettonMinter
      - name: Lint Tolk contracts and tests
        run: acton check
      - name: Run local emulator tests
        run: acton test
      - name: Run deployment and full payment E2E script in local emulator
        run: acton script scripts/deploy_testnet_e2e.tolk
      - name: Upload compiled escrow code and generated wrappers
        uses: actions/upload-artifact@v4
        with:
          name: ton-escrow-build-${{ github.sha }}
          path: |
            artifacts/GiftRadarEscrow.boc
            artifacts/GiftRadarPaymentEscrow.boc
            wrappers/GiftRadarEscrow.gen
            wrappers/GiftRadarPaymentEscrow.gen
          if-no-files-found: error
          retention-days: 7
