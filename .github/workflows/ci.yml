name: Validate HASSLE NFT Market

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hassle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hassle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile all backend modules
        run: python -m compileall -q app.py bot.py database.py marketplace.py marketplace_admin.py marketplace_offers.py ton_connect.py db_backup.py db_schema_audit.py db_sql_compat_audit.py db_transaction_audit.py db_rowcount_audit.py db_migration_preflight.py db_restore.py db_postgres_migration_plan.py db_postgres_ddl_plan.py db_postgres_data_migration.py db_postgres_schema_apply.py db_postgres_shadow_migration.py db_postgres_compat.py tests
      - name: Install test runner
        run: pip install pytest
      - name: Run API and database migration regression tests
        env:
          HASSLE_TEST_POSTGRES_DSN: postgresql://test:test@localhost:5432/hassle_test
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Check Svelte and TypeScript
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Deploy HASSLE NFT Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Required GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing."
            exit 1
          fi
          npx wrangler deploy

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: python -m json.tool railway.json > /dev/null
