name: Validate HASSLE NFT Market

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hassle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d hassle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Compile all backend modules
        run: python -m compileall -q app.py bot.py database.py marketplace.py marketplace_admin.py marketplace_offers.py ton_connect.py db_backup.py db_schema_audit.py db_sql_compat_audit.py db_transaction_audit.py db_rowcount_audit.py db_migration_preflight.py db_restore.py db_postgres_migration_plan.py db_postgres_ddl_plan.py db_postgres_data_migration.py db_postgres_schema_apply.py db_postgres_shadow_migration.py db_postgres_compat.py ton_multisig.py ton_multisig_transactions.py scripts/smoke_load.py tests
      - name: Install test runner
        run: pip install pytest
      - name: Run API and database migration regression tests
        env:
          HASSLE_TEST_POSTGRES_DSN: postgresql://test:test@localhost:5432/hassle_test
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Check Svelte and TypeScript
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.toml
      - name: Deploy HASSLE NFT Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Required GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are missing."
            exit 1
          fi
          npx wrangler deploy --config wrangler.toml

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: python -m json.tool railway.json > /dev/null
      - name: Validate operational shell scripts
        run: bash -n scripts/postgres_backup.sh scripts/postgres_restore.sh

  ton-multisig-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HASSLE NFT
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch pinned TON Core multisig-v2 source
        run: |
          git clone https://github.com/ton-blockchain/multisig-contract-v2.git /tmp/ton-multisig
          cd /tmp/ton-multisig
          git checkout 9a4b13df6345c9c4068ca725e434b40f9ea5ca28
      - name: Install pinned upstream dependencies
        working-directory: /tmp/ton-multisig
        run: npm ci --no-audit --no-fund
      - name: Run upstream multisig contract tests
        working-directory: /tmp/ton-multisig
        run: npm test -- --runInBand
      - name: Compile upstream multisig contract
        working-directory: /tmp/ton-multisig
        run: npx blueprint build Multisig
      - name: Derive and verify exact HASSLE Mainnet multisig configuration
        working-directory: /tmp/ton-multisig
        run: |
          cat > scripts/hassle-derive.ts <<'TS'
          import fs from 'node:fs';
          import { Address, Cell } from '@ton/core';
          import { Multisig } from '../wrappers/Multisig';

          const compiled = JSON.parse(fs.readFileSync('build/Multisig.compiled.json', 'utf8'));
          if (typeof compiled.hex !== 'string') throw new Error('Missing compiled Multisig BOC hex');
          const code = Cell.fromBoc(Buffer.from(compiled.hex, 'hex'))[0];
          const config = {
            threshold: 2,
            signers: [
              Address.parse('UQA3K2PGXyotga99en2ZXE_Ne9wY5u-lC07oQK6bRdxtENfs'),
              Address.parse('UQDqyqwz6TKotnrjHnEtWnlpZgEwNj5I54n5bAOmFivBR8ys'),
              Address.parse('UQCO3ghYMh52rbhO5leQQxu4AAUKz8DuW2wSVeZRN_MiHJyI'),
            ],
            proposers: [],
            allowArbitrarySeqno: false,
          };
          const wallet = Multisig.createFromConfig(config, code);
          const codeHash = code.hash().toString('hex');
          const dataHash = wallet.init!.data.hash().toString('hex');
          const publishedTonkeyCodeHash = 'd3d14da9a627f0ec3533341829762af92b9540b21bf03665fac09c2b46eabbac';
          if (codeHash !== publishedTonkeyCodeHash) {
            throw new Error('Compiled code hash does not match the published TON multisig-v2 hash');
          }
          console.log(JSON.stringify({
            network: 'mainnet',
            address: wallet.address.toRawString(),
            codeHash,
            dataHash,
            threshold: config.threshold,
            signers: config.signers.map((address) => address.toRawString()),
            proposers: config.proposers,
            allowArbitrarySeqno: config.allowArbitrarySeqno,
          }, null, 2));
          TS
          npx ts-node scripts/hassle-derive.ts
