name: Validate GIFT RADAR

on:
  push:
    branches: [main, feat/testnet-ton-usdt-escrow-e2e]
  pull_request:
    branches: [main, payments/stars-ton-proof-phase-2026-11-13, feat/ton-testnet-escrow, feat/escrow-configurable-authorities]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and lint tool
        run: pip install -r requirements.txt ruff
      - name: Lint newly added security and test modules
        run: ruff check --select E4,E7,E9,F app.py tests/test_api_surface_security.py asset_policy.py financial_ledger.py access_control.py security_controls.py tests/test_asset_policy.py tests/test_telegram_update_idempotency.py tests/test_financial_ledger.py tests/test_security_controls.py postgres_compat.py scripts/migrate_sqlite_to_postgres.py ton_deposit_monitor.py ton_payment_providers.py marketplace_settlement.py withdrawal_signer.py tests/test_marketplace_settlement.py tests/test_withdrawal_signer.py ton_nft_verifier.py ton_nft_providers.py marketplace_inventory.py tests/test_ton_deposit_monitor.py tests/test_ton_nft_verifier.py tests/test_ton_nft_providers.py tests/test_marketplace_inventory.py tests/test_nft_escrow_monitor.py tests/test_nft_escrow_release_gate.py tests/test_postgres_compat.py tests/test_telegram_stars.py tests/test_postgres_migrations.py escrow_authority_config.py tests/test_escrow_authority_config.py payment_routes.py tests/test_payment_routes.py ton_testnet_gateway.py tests/test_ton_testnet_gateway.py migrations/versions/0012_expire_unpaid_marketplace_deals.py
      - name: Compile all backend modules
        run: python -m compileall -q app.py bot.py marketplace.py demo_offers.py catalog_store.py financial_ledger.py ton_deposit_monitor.py ton_payment_providers.py marketplace_settlement.py withdrawal_signer.py ton_nft_verifier.py ton_nft_providers.py marketplace_inventory.py access_control.py security_controls.py postgres_compat.py escrow_authority_config.py payment_routes.py ton_testnet_gateway.py scripts migrations tests
      - name: Apply full schema migrations to CI SQLite database
        env:
          DATABASE_URL: sqlite:////tmp/gift-radar-ci-finance.sqlite3
        run: alembic upgrade head
      - name: Verify Railway SQLite database-path fallback
        env:
          GIFT_RADAR_DB_PATH: /tmp/gift-radar-ci-fallback.sqlite3
        run: alembic upgrade head
      - name: Run API and security regression tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check app.js
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Check Svelte and TypeScript
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  ton-proof-service:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TON Proof service dependencies
        working-directory: services/ton-proof
        run: npm install --no-audit --no-fund
      - name: Build TON Proof service
        working-directory: services/ton-proof
        run: npm run build

  deployment-config:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate deployment configuration
        run: python3 -m json.tool railway.json > /dev/null

  secret-scan:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          HOME: ${{ github.workspace }}

  postgres-integration:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gift_radar_ci
      GIFT_RADAR_POSTGRES_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install and start local PostgreSQL (no Docker service required)
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql
          PG_VERSION="$(pg_lsclusters --no-header | awk 'NR==1 {print $1}')"
          test -n "$PG_VERSION"
          pg_ctlcluster "$PG_VERSION" main start || pg_ctlcluster "$PG_VERSION" main status
          runuser -u postgres -- psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          runuser -u postgres -- psql -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='gift_radar_ci';"
          runuser -u postgres -- dropdb --if-exists gift_radar_ci
          runuser -u postgres -- createdb gift_radar_ci
          pg_isready -h 127.0.0.1 -U postgres -d gift_radar_ci
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Verify live PostgreSQL schema and append-only controls
        run: python -m unittest discover -s tests -p "test_postgres_migrations.py" -v
