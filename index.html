<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131b"><title>NFT Gift Scanner</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="wrap">
    <header><div class="brand">✦ NFT Gift Scanner</div><button id="lang">RU</button></header>
    <section class="hero">
      <p class="eyebrow" id="eyebrow">READ-ONLY MARKET MONITOR</p>
      <h1 id="heading">Telegram gifts, market data in one place.</h1>
      <p id="sub">Public collections, floor prices and marketplace activity.</p>
    </section>
    <section class="status">
      <div><span class="dot"></span><b id="api-title">Backend status</b></div>
      <p id="api-status">Checking connection…</p>
      <div class="sources" id="sources"></div>
    </section>
    <section class="section-head"><h2 id="collections-title">Collections</h2><span id="collections-count">—</span></section>
    <section class="collections" id="collections">
      <p class="empty" id="collections-empty">Waiting for marketplace data…</p>
    </section>
    <footer id="foot">Read-only public market data. No buying, selling or transfers.</footer>
  </main>
  <script src="app.js"></script>
</body></html>
